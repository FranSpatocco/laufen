<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Laufen: app de running hecha 100% en Flutter. Mapa en vivo, ritmo por km e historial de carreras, en web, Android e iOS.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="laufen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>laufen</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading splash: Flutter web needs a moment to download and start its
    engine, so instead of a blank page we show the wordmark right away in
    plain HTML/CSS. flutter_bootstrap.js removes it on the first frame.
  -->
  <style>
    @font-face {
      font-family: 'Outfit';
      src: url('assets/assets/fonts/Outfit-VariableFont_wght.ttf');
      font-weight: 100 900;
    }
    html, body { margin: 0; height: 100%; background: #F3EEE4; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 75% 20%, #F7E9D9, #F3EEE4 65%);
      transition: opacity 0.35s ease;
    }
    #splash .word {
      font-family: 'Outfit', system-ui, sans-serif; font-weight: 700;
      font-size: 56px; color: #9C5A32; letter-spacing: -0.5px;
    }
    #splash .track {
      width: 140px; height: 4px; border-radius: 4px; background: #E6D9C6; overflow: hidden;
    }
    #splash .track::after {
      content: ''; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #9C5A32; animation: run 1.1s ease-in-out infinite;
    }
    @keyframes run { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash"><div class="word">laufen</div><div class="track"></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
